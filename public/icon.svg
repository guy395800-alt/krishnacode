<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="favicon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="favicon-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="favicon-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="favicon-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="url(#favicon-bg)" stroke="url(#favicon-border)" stroke-width="1.2" />

  <!-- Monogram N Structure -->
  <!-- Left Pillar -->
  <path d="M 9 23 L 9 9.5 C 9 8.7 9.7 8 10.5 8 L 12 8 C 12.8 8 13.5 8.7 13.5 9.5 L 13.5 17.5 L 9 23 Z" fill="url(#favicon-grad-blue)" />
  
  <!-- Right Pillar -->
  <path d="M 18.5 14.5 L 18.5 22.5 C 18.5 23.3 19.2 24 20 24 L 21.5 24 C 22.3 24 23 23.3 23 22.5 L 23 9.5 C 23 8.7 22.3 8 21.5 8 L 20 8 C 19.2 8 18.5 8.7 18.5 9.5 Z" fill="url(#favicon-grad-blue)" />
  
  <!-- Center Dynamic Slash -->
  <path d="M 10.5 8 L 21.5 24 L 23 24 L 12 8 Z" fill="url(#favicon-grad-cyan)" />

  <!-- Code Syntax Flank Chevrons < > -->
  <path d="M 5.5 14 L 4 16 L 5.5 18" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 26.5 14 L 28 16 L 26.5 18" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Realtime Active Pulse Dot -->
  <circle cx="26" cy="6" r="2" fill="#10b981" />
</svg>
